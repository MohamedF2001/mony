name: mony
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  toggle_switch: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dartz: ^0.10.1
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
  share_plus: ^12.0.1
  flutter_dotenv: ^5.0.2
  google_generative_ai: ^0.4.7
  google_fonts: ^6.3.2
  equatable: ^2.0.7
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.1
  path_provider: ^2.1.5
  animations: ^2.1.1
  fl_chart: ^1.1.1
  url_launcher: ^6.3.2
  intl: ^0.20.1
  universal_html: ^2.2.4
  flutter_slidable: ^3.0.0
  connectivity_plus: ^7.0.0
  lottie: ^3.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  dio: ^5.4.0
  flutter_svg: ^2.3.0
  flutter_pdfview: ^1.3.2
  kkiapay_flutter_sdk:
  pdfx: ^2.9.2
  #turnable_page: ^1.0.1
  page_flip: ^0.2.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  analyzer: ^6.4.1
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/mony.jpg
    - assets/lotties/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
